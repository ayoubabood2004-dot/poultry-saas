<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>نظام الدواجن</title>
    <meta name="description" content="إدارة مشاريع الدواجن: المعمل والحقول والمفقس والمخازن والحسابات" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" sizes="180x180" />
    <meta name="theme-color" content="#f3f8fd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#080d17" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="الدواجن" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // قبل أوّل رسم: الوضع الداكن وحجم الواجهة ووضع الوضوح من إعداد الجهاز، حتى ما تومض الشاشة.
      // نفس المفتاح والشكل بـ src/lib/display.ts.
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('poultry.display') || '{}');
          var root = document.documentElement;
          var dark = s.theme === 'dark' || (s.theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) root.classList.add('dark');
          if (s.clarity === true) root.classList.add('clarity');
          if (typeof s.scale === 'number' && s.scale >= 80 && s.scale <= 125) root.style.fontSize = s.scale + '%';
        } catch (e) {}
      })();
    </script>
    <style>
      /* شاشة الإقلاع بـHTML صرف لحد ما يقلع React: بـdoctorVet كل فتح بارد كان صفحة بيضاء. */
      .boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f3f8fd;
        color: #0f1e35;
        font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
      }
      .dark .boot-splash {
        background: #080d17;
        color: #e7eef7;
      }
      .boot-splash svg {
        width: 72px;
        height: 72px;
      }
      .boot-splash strong {
        font-size: 1.25rem;
        letter-spacing: -0.02em;
      }
      .boot-splash span {
        font-size: 0.9rem;
        opacity: 0.7;
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        50% {
          opacity: 0.35;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash span {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" role="status">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <defs>
            <linearGradient id="boot-bg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#2b7bee" />
              <stop offset="1" stop-color="#0f5cc6" />
            </linearGradient>
            <clipPath id="boot-egg">
              <path d="M50 20C64 20 75 40 75 56C75 71 64 82 50 82C36 82 25 71 25 56C25 40 36 20 50 20Z" />
            </clipPath>
          </defs>
          <rect width="100" height="100" rx="22" fill="url(#boot-bg)" />
          <path d="M50 20C64 20 75 40 75 56C75 71 64 82 50 82C36 82 25 71 25 56C25 40 36 20 50 20Z" fill="#ffffff" />
          <path
            d="M22 51L33 44L41 52L50 43L59 52L67 44L78 51"
            fill="none"
            stroke="#1266d8"
            stroke-width="4"
            stroke-linejoin="round"
            stroke-linecap="round"
            clip-path="url(#boot-egg)"
          />
        </svg>
        <strong>نظام الدواجن</strong>
        <span>جارٍ فتح النظام…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
